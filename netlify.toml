# Positano Residences — static site, no build step
[build]
  publish = "."

# NOTE: no long-lived/immutable Cache-Control here on purpose.
# Asset filenames are not content-hashed, so Netlify's default
# etag-based caching is the safe choice (instant invalidation
# on every deploy).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
